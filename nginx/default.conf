server {
    listen 80;
    server_name test2-php.local.com;
    root /var/www/html;
    index index.php;

    # ซ่อนเวอร์ชัน Nginx
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # จำกัดขนาดไฟล์อัปโหลดสูงสุด 5MB
    client_max_body_size 5M;

    # ป้องกันการเข้าถึงไฟล์ซ่อน (.env, .git ฯลฯ) และโฟลเดอร์ config/includes
    location ~ /\. {
        deny all;
    }
    location ^~ /config/ {
        deny all;
    }
    location ^~ /includes/ {
        deny all;
    }

    # [สำคัญมาก] ห้ามรันสคริปต์ใดๆ ในโฟลเดอร์ uploads เด็ดขาด ป้องกันการอัปโหลด Web Shell
    location ^~ /uploads/ {
        location ~ \.php$ {
            deny all;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}