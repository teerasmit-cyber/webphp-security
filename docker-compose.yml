services:
  web:
    image: nginx:alpine
    container_name: ad_nginx
    ports:
      - "127.0.0.1:8092:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./src/uploads:/var/www/html/uploads
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app_network

  php:
    build: ./php
    container_name: ad_php
    volumes:
      - ./src:/var/www/html:ro
      - ./src/uploads:/var/www/html/uploads
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - app_network

  db:
    image: mariadb:10.11
    container_name: ad_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # ไม่มีการเปิด ports ออกสู่ภายนอก (เข้าถึงได้เฉพาะภายใน app_network เท่านั้น)
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data: